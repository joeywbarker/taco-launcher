# Builds the app on GitHub's computers every time code is pushed.
# The finished app (APK) is attached to a release called "latest",
# so you can download and install it straight from your phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TacoLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TacoLauncher
          path: TacoLauncher.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}. Download TacoLauncher.apk on your phone and open it to install.
          prerelease: true
          files: TacoLauncher.apk
