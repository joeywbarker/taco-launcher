# Builds the app on GitHub's computers every time code is pushed.
# The finished app (APK) is attached to a release called "latest",
# so you can download and install it straight from your phone.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      # Two copies: one with the version in its name (a new file name every update),
      # and one always called TacoLauncher.apk for the never-changing link.
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TacoLauncher.apk
          cp app/build/outputs/apk/debug/app-debug.apk TacoLauncher-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TacoLauncher
          path: TacoLauncher-v1.0.${{ github.run_number }}.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}. Download TacoLauncher.apk on your phone and open it to install.
          prerelease: true
          files: TacoLauncher.apk

      # Its own release per version. github.com/joeywbarker/taco-launcher/releases/latest
      # always opens the newest one.
      - name: Publish this version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Taco Launcher v1.0.${{ github.run_number }}
          body: Built from ${{ github.sha }}. Download TacoLauncher-v1.0.${{ github.run_number }}.apk on your phone and open it to install.
          make_latest: true
          files: TacoLauncher-v1.0.${{ github.run_number }}.apk
